<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Suscripciones</title>

        <link href="css/suscripcion.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">    </head>

    <body>


        <div id="header"> 
            <h1>Suscripciones</h1> 
        </div>

        <br>

        



        <div class="opciones">
    <button class="comercio" onclick="window.location.href='susa.html'" id="comer1"><img src="media/images/MRP.png" alt="MercaRed Plus 1 semana"><h3 id="titulo">MercaRed Plus 1 Semana</h3></button>

    <button class="comercio" onclick="window.location.href='susa.html'" id="comer2"><img src="media/images/MRP.png" alt="MercaRed Plus 3 Semanas"><h3 id="titulo">MercaRed Plus 3 Semanas</h3></button>

   


</div>
       

       
     
       <br>
       
        
       <button class="bottom" id="ini" onclick="window.location.href='principal.html'"> <i class="fa-regular fa-house" style="font-size: 40px"></i> Inicio</button>
       <button class="bottom" id="bus" onclick="window.location.href='buscar.html'"><i class="fa-solid fa-magnifying-glass" style="font-size: 40px"></i>Buscar</button>
       <button class="bottom" id="reg" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-plus" style="font-size: 40px"></i> Registrar</button>
       <button class="bottom" id="conf" onclick="window.location.href='configuracion.html'"> <i class="fa-solid fa-gear" style="font-size: 40px"></i>Configuración</button>
       <button class="bottom" id="sus" onclick="window.location.href='suscripcion.html'"><i class="fa-solid fa-credit-card" style="font-size: 40px"></i>Suscripción</button>

       <div id="blur" onclick="closed(event)">
            <div id="modal-codigo">
                <button id="closedb" onclick="closed(event)"><i class="fa-solid fa-xmark"></i></button>

                <p>Ingrese el código:</p>
                <input type="text" id="input-codigo" placeholder="">
                <button id="buscarb"  onclick="window.location.href='buscarb.html'">Buscar</button>
            </div>
        </div>

        <script>
            function extend() {
                document.getElementById('blur').classList.add('mostrar');
            }

            function closed(event) {
                if (event.target.id === 'blur' || event.target.closest('#closedb')) {
                    document.getElementById('blur').classList.remove('mostrar');
                }
            }
        </script>
 




    </body>


</html>
