<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercadito Av Revolución</title>

  <link href="css/coma.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <button id="back" onclick="window.location.href='principal.html'"><i class="fa-solid fa-reply"></i></button>
  <!--<audio autoplay src="media/music/september2015.mp3" type="audio/mpeg" loop></audio>-->
  <div id="header">
    <h1 id="nombre-comercio">Cargando mercado...</h1>

    <div class="acciones-comercio" id="acciones-comercio" hidden>
      <button id="editar-comercio" type="button">
        <i class="fa-solid fa-pen"></i>
        <span class="txt">Editar comercio</span>
      </button>

      <button id="eliminar-comercio" type="button">
        <i class="fa-solid fa-trash"></i>
        <span class="txt">Desactivar comercio</span>
      </button>
    </div>
  </div>

  <section class="informacion-mercado">
    <p id="descripcion-comercio" class="descripcion-breve"></p>

    <div class="datos-mercado">
      <div class="dato-mercado">
        <i class="fa-solid fa-location-dot"></i>
        <span id="ubicacion-comercio"></span>
      </div>

      <div class="dato-mercado">
        <i class="fa-regular fa-clock"></i>
        <div id="dias-comercio"></div>
      </div>
    </div>

    <div id="categorias-comercio" class="categorias-mercado"></div>
  </section>

  <p id="estado-comercio" role="status" aria-live="polite"></p>

  <br>

  <div class="suscom">
    <h3>Puestos del mercado</h3>

    <input type="search" id="combu" placeholder="Buscar puestos...">

    <select id="categoria">
      <option value="">Todas las categorías</option>
    </select>
  </div>

  <p id="estado-puestos" role="status" aria-live="polite"></p>

  <div id="lista-puestos"></div>

  <div class="suscom2">
    <h3>Calificación más alta a la más baja:</h3>
  </div>

  <br>

  <button class="bottom" id="ini" onclick="window.location.href='principal.html'"> <i class="fa-regular fa-house"
      style="font-size: 40px"></i> Inicio</button>
  <button class="bottom" id="bus" onclick="window.location.href='buscar.html'"><i class="fa-solid fa-magnifying-glass"
      style="font-size: 40px"></i>Buscar</button>
  <button class="bottom" id="reg" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-plus"
      style="font-size: 40px"></i> Registrar</button>
  <button class="bottom" id="conf" onclick="window.location.href='configuracion.html'"> <i class="fa-solid fa-gear"
      style="font-size: 40px"></i>Configuración</button>
  <button class="bottom" id="sus" onclick="window.location.href='suscripcion.html'"><i class="fa-solid fa-credit-card"
      style="font-size: 40px"></i>Suscripción</button>

  <div class="blur" id="blur-editar">
    <form class="modal modal-editar" id="formEditarComercio">
      <button class="cerrar-modal" id="cerrar-editar" type="button">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <p class="modal-titulo">Editar comercio</p>

      <label class="etiqueta" for="input-nombre">Nombre</label>
      <input id="input-nombre" name="nombreComercio" type="text" required>

      <label class="etiqueta" for="input-descripcion">Descripción</label>
      <textarea id="input-descripcion" name="descripcionComercio" rows="3"></textarea>

      <label class="etiqueta" for="input-ubicacion">Ubicación</label>
      <input id="input-ubicacion" name="direccion" type="text" required>

      <label class="etiqueta" for="input-categorias">Categorías</label>
      <textarea id="input-categorias" rows="2"></textarea>

      <span class="etiqueta">Días de funcionamiento</span>
      <div class="dias" id="dias-editar">
        <label class="dia"><input type="checkbox" value="Lunes"><span></span>Lu</label>
        <label class="dia"><input type="checkbox" value="Martes"><span></span>Ma</label>
        <label class="dia"><input type="checkbox" value="Miércoles"><span></span>Mi</label>
        <label class="dia"><input type="checkbox" value="Jueves"><span></span>Ju</label>
        <label class="dia"><input type="checkbox" value="Viernes"><span></span>Vi</label>
        <label class="dia"><input type="checkbox" value="Sábado"><span></span>Sa</label>
        <label class="dia"><input type="checkbox" value="Domingo"><span></span>Do</label>
      </div>

      <label class="etiqueta" for="input-apertura">Apertura</label>
      <input id="input-apertura" type="time" required>

      <label class="etiqueta" for="input-cierre">Cierre</label>
      <input id="input-cierre" type="time" required>

      <p id="mensaje-editar" role="status" aria-live="polite"></p>

      <button class="boton-modal" id="guardar-comercio" type="submit">
        Guardar cambios
      </button>
    </form>
  </div>

  <div class="blur" id="blur-eliminar">
    <div class="modal modal-eliminar">
      <p class="modal-titulo">¿Desactivar este mercado?</p>
      <p>Dejará de aparecer en el catálogo público. Podrás reactivarlo posteriormente.</p>

      <div class="botones-confirmar">
        <button class="boton-modal" id="confirmar-baja" type="button">
          Sí, desactivar
        </button>
        <button class="boton-modal boton-secundario" id="cancelar-baja" type="button">
          Cancelar
        </button>
      </div>
    </div>
  </div>
  <script src="js/coma.js"></script>
</body>

</html>
