<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Comercio</title>
  <link href="css/regcom.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <div id="header">
    <h1>Registro de Comercio</h1>
  </div>

  <button id="back" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-reply"></i></button>

  <form class="registro" id="formRegistroComercio" enctype="multipart/form-data">
    <div class="registro-grid">

      <div class="campo">
        <label for="nombre">Nombre del mercado:</label>
        <input type="text" id="nombre" name="nombreComercio" required maxlength="120">
      </div>

      <div class="campo campo-desc">
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcionComercio"></textarea>
      </div>

      <div class="campo">
        <label for="ubicacion">Ubicación:</label>
        <input type="text" id="ubicacion" name="direccion" required>
      </div>

      <div class="campo campo-cat">
        <label for="categorias">Categorías:</label>
        <textarea id="categorias" placeholder="Alimentos, ropa, artesanías"></textarea>
        <small>Separa las categorías mediante comas.</small>
      </div>

      <div class="campo campo-imagen">
        <label for="imagen">Imagen del comercio:</label>

        <label class="imagen-upload" for="imagen">
          <img id="preview-imagen" alt="Vista previa" hidden>
          <span id="placeholder-imagen">
            <i class="fa-solid fa-camera"></i>
            <span>Subir imagen</span>
          </span>
        </label>

        <input type="file" id="imagen" name="imagenComercio" accept="image/jpeg,image/png,image/webp" hidden>
      </div>

      <div class="campo campo-dias">
        <label>Días que se pone:</label>

        <div class="dias">
          <div class="dia"><input type="checkbox" id="lu" value="Lunes"><label for="lu">Lu</label></div>
          <div class="dia"><input type="checkbox" id="ma" value="Martes"><label for="ma">Ma</label></div>
          <div class="dia"><input type="checkbox" id="mi" value="Miércoles"><label for="mi">Mi</label></div>
          <div class="dia"><input type="checkbox" id="ju" value="Jueves"><label for="ju">Ju</label></div>
          <div class="dia"><input type="checkbox" id="vi" value="Viernes"><label for="vi">Vi</label></div>
          <div class="dia"><input type="checkbox" id="sa" value="Sábado"><label for="sa">Sa</label></div>
          <div class="dia"><input type="checkbox" id="do" value="Domingo"><label for="do">Do</label></div>
        </div>
      </div>

      <div class="campo">
        <label for="apertura">Hora de apertura:</label>
        <input type="time" id="apertura" value="09:00" required>
      </div>

      <div class="campo">
        <label for="cierre">Hora de cierre:</label>
        <input type="time" id="cierre" value="18:00" required>
      </div>

    </div>

    <p id="mensajeRegistroComercio" role="status" aria-live="polite"></p>

    <button id="ragbot" type="submit">Registrar comercio</button>
  </form>

  <script type="module" src="/js/registrarComercio.js"></script>
</body>

</html>
