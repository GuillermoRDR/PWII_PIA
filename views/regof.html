<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Oferta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <link href="css/regcom.css" rel="stylesheet">
</head>

<body>
  <div id="header">
    <h1>Registro de Oferta</h1>
  </div>

  <button id="back" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-reply"></i></button>

  <div class="registro">
    <div class="registro-grid">

      <div class="columna">
        <div class="campo">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" placeholder="">
        </div>

        <div class="campo">
          <label for="codigo">Código:</label>
          <input type="text" id="codigo" placeholder="">
        </div>
      </div>

      <div class="columna">
        <div class="campo campo-desc">
          <label for="descripcion">Descripción:</label>
          <textarea id="descripcion"></textarea>
        </div>

        <div class="campo campo-imagen">
          <label for="imagen">Imagen de la oferta:</label>
          <div class="imagen-upload" onclick="document.getElementById('imagen').click()">
            <img id="preview-imagen" src="" alt="" style="display: none;">
            <div id="placeholder-imagen">
              <i class="fa-solid fa-camera"></i>
              <span>Subir imagen</span>
            </div>
          </div>
          <input type="file" id="imagen" accept="image/*" style="display: none;" onchange="previsualizarImagen(event)">
        </div>
      </div>
    </div>
  </div>

  <button id="ragbot" onclick="window.location.href='principal.html'">Registrar oferta</button>

  <script>
    function previsualizarImagen(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = document.getElementById('preview-imagen');
        const placeholder = document.getElementById('placeholder-imagen');
        img.src = e.target.result;
        img.style.display = 'block';
        placeholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
  </script>

</body>

</html>
