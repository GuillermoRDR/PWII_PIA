<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado | MercaRed</title>

  <link href="css/ragcom.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <button id="back" onclick="window.location.href='buscara.html'"><i class="fa-solid fa-reply"></i></button>

  <div id="header">
    <h1 id="nombre-comercio">Cargando mercado...</h1>
    <label id="horario-comercio"></label>
  </div>

  <p id="estado-comercio" role="status" aria-live="polite"></p>

  <div class="suscom">
    <h3>Puestos del mercado</h3>

    <input type="search" id="combu" placeholder="Buscar puestos...">

    <select id="categoria">
      <option value="">Todas las categorías</option>
    </select>
  </div>

  <p id="estado-puestos" role="status" aria-live="polite"></p>

  <div id="lista-puestos"></div>

  <button id="ragbot" onclick="window.location.href='principal.html'"> Agregar a mis comercios</button>

  <script src="js/ragcom.js"></script>
</body>

</html>
