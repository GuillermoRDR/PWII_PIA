<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>

  <link href="css/configuracion.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <div id="header">
    <h1>Configuración</h1>
  </div>

  <br>

  <div class="opciones">
    <div class="mon" id="música"><input type="checkbox" checked><label>Música.</label></div>
    <div class="mon" id="sfx"> <input type="checkbox" checked><label>Efectos de sonido.</label></div>
    <button class="mon" onclick="extend()" id="cred">
      <h3>Créditos</h3>
    </button>
  </div>

  <div id="blur" onclick="closed(event)">
    <div id="modal-codigo">
      <button id="closedb" onclick="closed(event)"><i class="fa-solid fa-xmark"></i></button>
      <p>Créditos:</p>
      <label>Guillermo René Dávila Roque. 2003063​.</label>
      <br>
      <label>Fernando Guzmán Díaz. 1948627.</label>
      <br>
      <label>Juan Enrique Leal Gutiérrez. 1957848.</label>
    </div>
  </div>

  <script>
    function extend() {
      document.getElementById('blur').classList.add('mostrar');
    }
    function closed(event) {
      if (event.target.id === 'blur' || event.target.closest('#closedb')) {
        document.getElementById('blur').classList.remove('mostrar');
      }
    }
  </script>

  <br>

  <button class="bottom" id="ini" onclick="window.location.href='principal.html'"> <i class="fa-regular fa-house"
      style="font-size: 40px"></i> Inicio</button>
  <button class="bottom" id="bus" onclick="window.location.href='buscar.html'"><i class="fa-solid fa-magnifying-glass"
      style="font-size: 40px"></i>Buscar</button>
  <button class="bottom" id="reg" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-plus"
      style="font-size: 40px"></i> Registrar</button>
  <button class="bottom" id="conf" onclick="window.location.href='configuracion.html'"> <i class="fa-solid fa-gear"
      style="font-size: 40px"></i>Configuración</button>
  <button class="bottom" id="sus" onclick="window.location.href='suscripcion.html'"><i class="fa-solid fa-credit-card"
      style="font-size: 40px"></i>Suscripción</button>
</body>

</html>
