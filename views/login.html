<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>

<body>
  <form id="formLogin">
    <div class="registro">
      <h1 class="logo">MR</h1>
      <p class="titulo">Iniciar Sesión</p>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required>
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="password" autocomplete="current-password" required>
      </div>

      <div class="enlaces">
        <a href="#" id="recuperarPassword">
          ¿Olvidaste tu contraseña?
        </a>

        <br>

        <span class="registro-cuenta" style="text-align: center;">
          ¿No tienes cuenta?<br>
          <a href="/registro">Regístrate Aquí</a>
        </span>
      </div>
    </div>

    <button id="ragbot" type="submit">
      Iniciar sesión
    </button>

    <p id="mensajeLogin" role="status" aria-live="polite"></p>
  </form>

  <script type="module" src="/js/login.js"></script>
</body>

</html>
