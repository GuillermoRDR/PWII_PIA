<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don Javier</title>

  <link href="css/perfil.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <button id="back" onclick="window.location.href='/'"><i class="fa-solid fa-reply"></i></button>
  <div class="ficha">
    <h2 id="tdp">Mi perfil</h2>

    <div class="ficha-top">
      <div class="ficha-left">
        <img src="media/images/default.png" alt="Fotografía de perfil" class="ficha-img" id="foto-perfil">
        <p class="categoria">
          <strong id="genero-edad">Informacion personal</strong>
        </p>
        <p class="palabras-clave" id="fecha-registro"></p>

        <div class="acciones-perfil">
          <button id="editar-perfil" type="button">
            <i class="fa-solid fa-pen"></i> Editar perfil
          </button>
          <button id="eliminar-perfil" type="button">
            <i class="fa-solid fa-trash"></i> Eliminar usuario
          </button>
          <button id="cerrar-sesion" type="button">
            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
          </button>
        </div>
      </div>

      <div class="ficha-right">
        <div class="rating">
          <span id="tipo-usuario"></span>
        </div>

        <hr>

        <p class="horario" id="localidad-perfil"></p>

        <hr>

        <div class="ficha-desc">
          <h3>Descripción:</h3>
          <p id="descripcion-perfil"></p>
          <br>
          <h3>Críticas recientes:</h3>
          <p>AAAAAAh no me da el tiempo que tengo </p>
        </div>
      </div>
    </div>
  </div>

  <br>

  <button class="bottom" id="ini" onclick="window.location.href='principal.html'"> <i class="fa-regular fa-house"
      style="font-size: 40px"></i> Inicio</button>
  <button class="bottom" id="bus" onclick="window.location.href='buscar.html'"><i class="fa-solid fa-magnifying-glass"
      style="font-size: 40px"></i>Buscar</button>
  <button class="bottom" id="reg" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-plus"
      style="font-size: 40px"></i> Registrar</button>
  <button class="bottom" id="conf" onclick="window.location.href='configuracion.html'"> <i class="fa-solid fa-gear"
      style="font-size: 40px"></i>Configuración</button>
  <button class="bottom" id="sus" onclick="window.location.href='suscripcion.html'"><i class="fa-solid fa-credit-card"
      style="font-size: 40px"></i>Suscripción</button>

  <div class="blur" id="blur-editar">
    <form class="modal modal-editar" id="formEditarPerfil">
      <button class="cerrar-modal" type="button" id="cerrar-editar">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <p class="modal-titulo">Editar perfil</p>

      <div class="campo-foto">
        <img id="vista-foto" src="media/images/default.png" alt="Vista previa">
        <label for="input-foto" class="boton-foto">
          <i class="fa-solid fa-camera"></i> Cambiar foto
        </label>
        <input type="file" id="input-foto" name="fotoPerfil" accept="image/jpeg,image/png,image/webp">
      </div>

      <label class="etiqueta" for="input-nombre">Nombre de usuario</label>
      <input id="input-nombre" name="nombreUsuario" type="text" required>

      <label class="etiqueta" for="input-localidad">Localidad</label>
      <input id="input-localidad" name="localidad" type="text">

      <label class="etiqueta" for="select-genero">Género</label>
      <select id="select-genero" name="genero">
        <option value="">Prefiero no especificar</option>
        <option value="femenino">Femenino</option>
        <option value="masculino">Masculino</option>
        <option value="no-binario">No binario</option>
      </select>

      <label class="etiqueta" for="input-edad">Edad</label>
      <input id="input-edad" name="edad" type="number" min="0" step="1">

      <label class="etiqueta" for="input-descripcion">Descripción</label>
      <textarea id="input-descripcion" name="descripcionPerfil" rows="4"></textarea>

      <p id="mensaje-editar" role="status" aria-live="polite"></p>

      <button class="boton-modal" type="submit" id="guardar-perfil">
        Guardar cambios
      </button>
      </form>
    </div>

    <div class="blur" id="blur-eliminar">
      <div class="modal modal-eliminar">
        <p class="modal-titulo">Eliminar cuenta</p>
        <p>Esta funcionalidad todavía no está disponible.</p>

        <button class="boton-modal boton-secundario" type="button" id="cerrar-eliminar">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/perfil.js"></script>
</body>

</html>
