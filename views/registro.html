<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>

  <link href="css/registro.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <div class="registro">
    <p class="titulo">Únete a MercaRed</p>

    <div class="avatar-upload" onclick="document.getElementById('foto').click()">
      <img id="preview-avatar" src="" alt="">
      <i id="placeholder-avatar" class="fa-solid fa-user"></i>
    </div>
    <input type="file" id="foto" accept="image/*" style="display: none;" onchange="previsualizarAvatar(event)">

    <div class="registro-grid">

      <div class="columna">
        <div class="campo">
          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" placeholder="">
        </div>

        <div class="campo">
          <label for="correo">Correo electronico</label>
          <input type="email" id="correo" placeholder="">
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" placeholder="">
        </div>
      </div>

      <div class="columna">
        <div class="campo">
          <label for="localidad">Localidad</label>
          <input type="text" id="localidad" placeholder="">
        </div>

        <div class="campo">
          <label for="tipo-usuario">Tipo de usuario</label>
          <select id="tipo-usuario">
            <option value="cliente" selected>Cliente</option>
            <option value="comerciante">Comerciante</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="campo">
          <label for="genero">Género</label>
          <select id="genero">
            <option value="femenino" selected>Femenino</option>
            <option value="masculino">Masculino</option>
            <option value="no-binario">No binario</option>
          </select>
        </div>
      </div>

      <div class="columna">
        <div class="campo">
          <label for="edad">Edad</label>
          <input type="number" id="edad" min="0" placeholder="">
        </div>

        <div class="campo campo-desc">
          <label for="descripcion">Descripción de perfil</label>
          <textarea id="descripcion"></textarea>
        </div>
      </div>

    </div>
  </div>

  <button id="ragbot" onclick="window.location.href='login.html'">Registrar</button>

  <script>
    function previsualizarAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = document.getElementById('preview-avatar');
        const placeholder = document.getElementById('placeholder-avatar');
        img.src = e.target.result;
        img.style.display = 'block';
        placeholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
  </script>

</body>

</html>
