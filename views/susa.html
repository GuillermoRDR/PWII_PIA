<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suscripción</title>

  <link href="css/susa.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <div id="header">
    <h1 id="titulo-suscripcion">Cargando suscripción...</h1>
  </div>

  <br>

  <button id="back" type="button" onclick="window.location.href='suscripcion.html'"><i class="fa-solid fa-reply"></i></button>
  <div class="ficha">
    <h2 id="tdp">Cargando suscripción...</h2>

    <div class="acciones-suscripcion" id="acciones-suscripcion" style="display: none;">
      <button id="editar-suscripcion" type="button"><i class="fa-solid fa-pen"></i><span class="txt">Editar suscripción</span></button>
      <button id="eliminar-suscripcion" type="button"><i class="fa-solid fa-trash"></i><span class="txt">Desactivar suscripción</span></button>
    </div>

    <div class="ficha-top">

      <div class="ficha-left">
        <img src="media/images/MRP.png" alt="Imagen de la suscripción" class="ficha-img" id="foto-suscripcion">
      </div>

      <div class="ficha-right">
        <p class="horario" id="costo-suscripcion"></p>

        <hr>

        <p class="horario" id="duracion-suscripcion"></p>

        <hr>

        <div class="ficha-desc">
          <h3>Descripción:</h3>
          <p id="descripcion-suscripcion">Cargando descripción...</p>
        </div>
      </div>
    </div>
  </div>

  <br>

  <p id="estado-suscripcion" role="status" aria-live="polite"></p>

  <button id="ragbot" type="button" disabled> Suscribirse</button>

  <div class="blur" id="blur-editar">
    <form class="modal modal-editar" id="formEditarSuscripcion">
      <button class="cerrar-modal" id="cerrar-editar" type="button"><i class="fa-solid fa-xmark"></i></button>
      <p class="modal-titulo">Editar suscripción</p>

      <label class="etiqueta" for="input-nombre">Nombre:</label>
      <input type="text" id="input-nombre" required>

      <label class="etiqueta" for="input-costo">Costo (MXN):</label>
      <input type="number" id="input-costo" min="0" step="any" required>

      <label class="etiqueta" for="input-duracion">Duración (días):</label>
      <input type="number" id="input-duracion" min="1" step="1" required>

      <label class="etiqueta" for="input-descripcion">Descripción:</label>
      <textarea id="input-descripcion" rows="4" required></textarea>

      <span class="etiqueta">Imagen de la suscripción:</span>
      <label class="subir-imagen" id="vista-imagen" for="input-imagen">
        <i class="fa-solid fa-camera"></i>
        <span id="texto-imagen">Subir imagen</span>
      </label>
      <input type="file" id="input-imagen" accept="image/jpeg,image/png,image/webp">

      <p id="mensaje-editar" role="status" aria-live="polite"></p>

      <button class="boton-modal" id="guardar-suscripcion" type="submit">Guardar cambios</button>
    </form>
  </div>

  <div class="blur" id="blur-eliminar">
    <div class="modal modal-eliminar">
      <p class="modal-titulo">¿Desactivar esta suscripción?</p>
      <p>Dejará de mostrarse en el catálogo. Las suscripciones ya compradas siguen vigentes.</p>

      <div class="botones-confirmar">
        <button class="boton-modal" id="confirmar-baja" type="button">Sí, desactivar</button>
        <button class="boton-modal boton-secundario" id="cancelar-baja" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="js/susa.js"></script>
</body>

</html>
