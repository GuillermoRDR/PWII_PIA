<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Suscripción</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <link href="css/regcom.css" rel="stylesheet">
</head>

<body>
  <div id="header">
    <h1>Registro de Suscripción</h1>
  </div>

  <button id="back" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-reply"></i></button>

  <form class="registro" id="formRegistroSuscripcion" enctype="multipart/form-data">
    <div class="registro-grid">

      <div class="columna">
        <div class="campo">
          <label for="titulo">Nombre:</label>
          <input type="text" id="titulo" name="titulo" required maxlength="120">
        </div>

        <div class="campo">
          <label for="precio">Costo (MXN):</label>
          <input type="text" id="precio" name="precio" inputmode="decimal" required
            oninput="this.value = this.value.replace(/[^0-9.]/g, '')">
        </div>

        <div class="campo">
          <label for="duracion">Duración (días):</label>
          <input type="number" id="duracion" name="duracion" min="1" step="1" required>
        </div>
      </div>

      <div class="columna">
        <div class="campo campo-desc">
          <label for="descripcion">Descripción:</label>
          <textarea id="descripcion" name="descripcion" required></textarea>
        </div>

        <div class="campo campo-imagen">
          <label for="imagen">Imagen de la suscripción:</label>

          <label class="imagen-upload" for="imagen">
            <img id="preview-imagen" alt="Vista previa" hidden>
            <span id="placeholder-imagen">
              <i class="fa-solid fa-camera"></i>
              <span>Subir imagen</span>
            </span>
          </label>

          <input type="file" id="imagen" name="imagenSuscripcion" accept="image/jpeg,image/png,image/webp" hidden>
        </div>
      </div>

    </div>

    <p id="mensajeRegistroSuscripcion" role="status" aria-live="polite"></p>

    <button id="ragbot" type="submit">Registrar suscripción</button>
  </form>

  <script type="module" src="/js/registrarSuscripcion.js"></script>
</body>

</html>
