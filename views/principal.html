<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MercaRed</title>

  <link href="css/principal.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body>
  <!--<audio autoplay src="media/music/september2015.mp3" type="audio/mpeg" loop></audio>-->
  <div id="header">
    <h1>MercaRed</h1>
  </div>

  <br>

  <button id="prof" type="button" onclick="window.location.href='perfil.html'">
    <span id="nombre-usuario">Mi perfil</span>
    <img id="foto-usuario" src="/media/images/default.png" alt="Foto de perfil">
  </button>

  <main class="contenido-principal">

    <section class="seccion-inicio">
      <div class="encabezado-seccion">
        <h2>Explorar mercados</h2>
        <a href="buscara.html">Ver todos</a>
      </div>

      <div id="explorar-comercios" class="comercios"></div>
      <p id="estado-comercios" class="mensaje-estado"></p>
    </section>

    <section class="seccion-inicio">
      <div class="encabezado-seccion">
        <h2>Puestos recientes</h2>
      </div>

      <div id="puestos-recientes" class="comercios"></div>
      <p id="estado-puestos" class="mensaje-estado"></p>
    </section>

  </main>

  <br>

  <button class="bottom" id="ini" onclick="window.location.href='principal.html'"> <i class="fa-regular fa-house"
      style="font-size: 40px"></i> Inicio</button>
  <button class="bottom" id="bus" onclick="window.location.href='buscar.html'"><i class="fa-solid fa-magnifying-glass"
      style="font-size: 40px"></i>Buscar</button>
  <button class="bottom" id="reg" onclick="window.location.href='registrar.html'"><i class="fa-solid fa-plus"
      style="font-size: 40px"></i> Registrar</button>
  <button class="bottom" id="conf" onclick="window.location.href='configuracion.html'"> <i class="fa-solid fa-gear"
      style="font-size: 40px"></i>Configuración</button>
  <button class="bottom" id="sus" onclick="window.location.href='suscripcion.html'"><i class="fa-solid fa-credit-card"
      style="font-size: 40px"></i>Suscripción</button>

  <script src="js/principal.js"></script>
</body>

</html>
